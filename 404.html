<!DOCTYPE html>

<html lang="tr" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Sayfa Bulunamadı | Engrare</title>
<link rel="icon" href="https://www.engrare.com/files/photos/title_icon.png" type="image/png" sizes="48x48">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.engrare.com/files/photos/title_icon.png" />
<meta property="og:title" content="Engrare - Sayfa Bulunamadı">
<meta property="og:url" content="https://www.engrare.com">
<meta property="og:description" content="Engrare takımının websitesine hoş geldiniz.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* {
	box-sizing: border-box;
}
body {
	min-height: 100vh;
	margin: 0;
	background: radial-gradient(circle at top center, rgba(37, 99, 235, 0.16), transparent 60%), #0b0d10;
	color: #f8fafc;
	font-family: 'Inter', sans-serif;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}
.top_bar {
	height: 64px;
	background: rgba(11, 13, 16, 0.88);
	backdrop-filter: blur(16px);
	border-bottom: 1px solid rgba(255, 255, 255, 0.08);
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 0 24px;
}
.logo_wrap {
	display: flex;
	align-items: center;
	gap: 10px;
	text-decoration: none;
	color: #ffffff;
}
.logo_wrap img {
	height: 40px;
}
.logo_txt {
	font-weight: 800;
	font-size: 16px;
}
.center_box {
	max-width: 540px;
	margin: auto;
	padding: 40px 24px;
	text-align: center;
}
.err_code {
	font-family: 'Montserrat', sans-serif;
	font-size: clamp(64px, 12vw, 110px);
	font-weight: 800;
	background: linear-gradient(135deg, #38bdf8, #2563eb);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	margin: 0;
	line-height: 1;
}
h1 {
	font-family: 'Montserrat', sans-serif;
	font-size: 28px;
	margin: 12px 0 10px 0;
}
p {
	color: #94a3b8;
	font-size: 16px;
	line-height: 1.6;
	margin: 0 0 28px 0;
}
.btn_group {
	display: flex;
	gap: 12px;
	justify-content: center;
	flex-wrap: wrap;
}
.btn {
	display: inline-flex;
	align-items: center;
	gap: 8px;
	padding: 13px 24px;
	border-radius: 999px;
	font-weight: 700;
	font-size: 15px;
	text-decoration: none;
	transition: transform 0.2s ease;
}
.btn:hover {
	transform: translateY(-2px);
}
.btn_primary {
	background: linear-gradient(135deg, #2563eb, #06b6d4);
	color: #ffffff;
	box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
}
.btn_secondary {
	background: rgba(255, 255, 255, 0.1);
	border: 1px solid rgba(255, 255, 255, 0.2);
	color: #ffffff;
}
.footer {
	text-align: center;
	padding: 18px;
	font-size: 14px;
	color: #64748b;
	border-top: 1px solid rgba(255, 255, 255, 0.08);
}
</style>
</head>
<body>
	<div class="top_bar">
		<a href="/" class="logo_wrap">
			<img src="https://www.engrare.com/files/photos/engrare_logo.png" alt="Engrare Logo">
			<span class="logo_txt">ENGRARE</span>
		</a>
		<a href="/our_team/#basvuru" class="btn btn_primary" style="padding: 8px 16px; font-size: 13.5px;">
			<i class="fa-solid fa-user-plus"></i> Ekibe Katıl
		</a>
	</div>

	<div class="center_box">
		<div class="err_code">404</div>
		<h1>Sanırım Kayboldun!</h1>
		<p>Aradığın sayfa taşınmış veya kaldırılmış olabilir. Ana sayfaya dönebilir veya doğrudan takım üyelik başvuru formuna geçebilirsin.</p>
		<div class="btn_group">
			<a href="/" class="btn btn_secondary">
				<i class="fa-solid fa-house"></i> Ana Sayfaya Dön
			</a>
			<a href="/our_team/#basvuru" class="btn btn_primary">
				<i class="fa-solid fa-rocket"></i> Ekibe Katıl (Başvuru Formu)
			</a>
		</div>
	</div>

	<div class="footer">
		Bu websitesinin tüm hakları Kaya Sertel ve <b>Engrare®</b> ekibine aittir.
	</div>
</body>
</html>
